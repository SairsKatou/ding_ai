# 代码本地浅克隆缓存目录与保留时间（方案 A：保留 2 小时，避免高频重复拉取）
aliyun.devops.cloneCacheDir=data/repo_cache
aliyun.devops.cloneCacheExpireHours=2

# OpenCode 大模型接入配置
opencode.enabled=true
# OpenCode Go 套餐专属 API 端点
opencode.apiUrl=https://opencode.ai/zen/go/v1/chat/completions
opencode.apiKey=oc_sk_ae4a146ea7b0_mP6OT5QACwJI7yWsMsYZd_GoQq0ovXE9
# 默认主模型
opencode.model=deepseek-v4.1-flash
opencode.temperature=0.7
opencode.maxTokens=2048
# HTTP 超时配置 (毫秒：连接超时 10 秒，读取超时 180 秒即 3 分钟)
opencode.connectTimeout=10000
opencode.readTimeout=180000

# 多模型重试与故障转移策略
# 单模型可失败3次，超过切换模型；最多切换3个模型，累计9次失败抛出异常
opencode.maxRetriesPerModel=3
opencode.maxModelSwitchCount=3

# 多模型配置列表（OpenCode Go 套餐支持的模型轮换列表）
# 模型 1 (优先：极速响应与代码模型)
opencode.models[0].model=deepseek-v4.1-flash
# 模型 2 (备选 1：强逻辑与复杂推理模型)
opencode.models[1].model=glm-5.3-flash
# 模型 3 (备选 2：长上下文理解与对话模型)
opencode.models[2].model=deepseek-v4-pro

